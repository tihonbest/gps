<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#08090d">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Speed</title>

<style>
:root {
    color-scheme: dark;
    --bg: #08090d;
    --text: #f5f5f7;
    --muted: #858995;
    --accent: #65e6b2;
    --ring: #252831;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
}

.instrument {
    position: relative;
    width: min(84vw, 380px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Внешнее кольцо компаса */

.compass {
    position: absolute;
    inset: 0;
    border: 1px solid var(--ring);
    border-radius: 50%;
}

/* Треугольная стрелка на внешнем кольце */

.needle {
    position: absolute;
    top: -8px;
    left: 50%;
    width: 0;
    height: 0;

    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 18px solid var(--accent);

    transform: translateX(-50%) rotate(0deg);
    transform-origin: 50% calc(50% + 8px);

    filter: drop-shadow(0 0 6px #65e6b244);
}

/* Внутренний спидометр */

.speed-ring {
    position: absolute;
    inset: 13%;
    border-radius: 50%;
    border: 1px solid #1c1f27;

    background: radial-gradient(
        circle,
        #11131a 0%,
        #0b0c11 75%,
        #08090d 100%
    );
}

/* Центральное значение */

.center {
    position: relative;
    z-index: 2;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    width: 100%;
}

.speed {
    font-size: clamp(58px, 17vw, 88px);
    line-height: 1;
    font-weight: 300;
    letter-spacing: -5px;

    font-variant-numeric: tabular-nums;
}

.unit {
    margin-top: 13px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
}

/* Кнопка запуска */

.start-area {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(28px, env(safe-area-inset-bottom));

    display: flex;
    justify-content: center;
}

button {
    border: 1px solid #282b35;
    background: #11131a;
    color: #d9dbe2;

    padding: 13px 24px;
    border-radius: 30px;

    font-size: 14px;
    cursor: pointer;
}

button:active {
    background: #1c2029;
}

@media (max-height: 550px) {
    .instrument {
        width: min(60vh, 300px);
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="instrument">

        <div class="compass"></div>

        <!-- Стрелка компаса -->
        <div class="needle" id="needle"></div>

        <div class="speed-ring"></div>

        <div class="center">
            <div class="speed" id="speed">0.0</div>
            <div class="unit">КМ/Ч</div>
        </div>

    </div>

</div>

<div class="start-area">
    <button id="start">Запустить</button>
</div>

<script>
(() => {
    "use strict";

    const needle = document.getElementById("needle");
    const speedElement = document.getElementById("speed");
    const startButton = document.getElementById("start");

    let running = false;
    let gpsWatch = null;

    let estimatedSpeed = 0;
    let displayedSpeed = 0;

    let gpsSpeed = null;
    let lastGpsTime = 0;
    let lastCorrection = 0;

    let lastMotionTime = null;
    let lastAcceleration = null;

    let calibrationSamples = [];
    let gravityBaseline = null;
    let calibrated = false;

    let lastRenderTime = performance.now();

    const MAX_SPEED = 150;

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    /*
     * КОМПАС
     *
     * На iOS используем webkitCompassHeading,
     * если браузер предоставляет это свойство.
     *
     * Стрелка остаётся на север относительно
     * окружающего мира при повороте телефона.
     */

    function updateCompass(heading) {
        if (!Number.isFinite(heading)) return;

        const angle = ((heading % 360) + 360) % 360;

        needle.style.transform =
            `translateX(-50%) rotate(${-angle}deg)`;
    }

    function handleOrientation(event) {
        if (event.webkitCompassHeading != null) {
            updateCompass(event.webkitCompassHeading);
        } else if (event.alpha != null) {
            /*
             * Запасной вариант.
             * alpha не всегда совпадает с показаниями
             * настоящего магнитного компаса.
             */
            updateCompass(event.alpha);
        }
    }

    /*
     * АКСЕЛЕРОМЕТР
     *
     * Экспериментальная оценка движения.
     * Интегрирование ускорения накапливает ошибки.
     */

    function handleMotion(event) {
        const a = event.accelerationIncludingGravity;

        if (!a ||
            a.x == null ||
            a.y == null ||
            a.z == null) {
            return;
        }

        const now = performance.now();

        const current = {
            x: a.x,
            y: a.y,
            z: a.z
        };

        if (!calibrated) {
            calibrationSamples.push(current);

            if (calibrationSamples.length > 30) {
                calibrationSamples.shift();
            }

            if (calibrationSamples.length === 30) {
                gravityBaseline = {
                    x: calibrationSamples.reduce(
                        (sum, p) => sum + p.x, 0
                    ) / 30,

                    y: calibrationSamples.reduce(
                        (sum, p) => sum + p.y, 0
                    ) / 30,

                    z: calibrationSamples.reduce(
                        (sum, p) => sum + p.z, 0
                    ) / 30
                };

                calibrated = true;
            }

            lastAcceleration = current;
            lastMotionTime = now;
            return;
        }

        if (lastAcceleration && lastMotionTime !== null) {
            const dt = (now - lastMotionTime) / 1000;

            if (dt > 0 && dt < 0.15) {
                const ax = a.x - gravityBaseline.x;
                const ay = a.y - gravityBaseline.y;
                const az = a.z - gravityBaseline.z;

                const magnitude = Math.sqrt(
                    ax * ax + ay * ay + az * az
                );

                estimatedSpeed += magnitude * dt * 3.6;

                estimatedSpeed = clamp(
                    estimatedSpeed, 0, MAX_SPEED
                );
            }
        }

        lastAcceleration = current;
        lastMotionTime = now;
    }

    /*
     * GPS
     *
     * Используется для периодической коррекции.
     */

    function handleGPS(position) {
        const now = Date.now();
        const speed = position.coords.speed;

        lastGpsTime = now;

        if (speed == null || !Number.isFinite(speed)) {
            return;
        }

        gpsSpeed = clamp(speed * 3.6, 0, MAX_SPEED);

        if (now - lastCorrection >= 3000) {
            estimatedSpeed =
                estimatedSpeed * 0.2 +
                gpsSpeed * 0.8;

            lastCorrection = now;
        }
    }

    function renderSpeed(value) {
        const now = performance.now();

        const dt = Math.min(
            (now - lastRenderTime) / 1000,
            0.1
        );

        lastRenderTime = now;

        const smoothing = 1 - Math.exp(-dt * 5);

        displayedSpeed +=
            (value - displayedSpeed) * smoothing;

        if (Math.abs(displayedSpeed) < 0.05) {
            displayedSpeed = 0;
        }

        speedElement.textContent =
            clamp(displayedSpeed, 0, MAX_SPEED).toFixed(1);
    }

    function update() {
        if (!running) return;

        const now = Date.now();

        /*
         * GPS — периодическая коррекция.
         * Между обновлениями GPS используем оценку
         * по данным датчиков движения.
         */

        if (gpsSpeed !== null && now - lastGpsTime < 2000) {
            renderSpeed(gpsSpeed);
        } else {
            renderSpeed(estimatedSpeed);
        }

        requestAnimationFrame(update);
    }

    async function start() {
        if (running) return;

        startButton.disabled = true;
        startButton.textContent = "Запуск…";

        let motionPermission = true;
        let orientationPermission = true;

        try {
            if (
                typeof DeviceMotionEvent !== "undefined" &&
                typeof DeviceMotionEvent.requestPermission ===
                    "function"
            ) {
                motionPermission =
                    await DeviceMotionEvent.requestPermission()
                    === "granted";
            }

            if (
                typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission ===
                    "function"
            ) {
                orientationPermission =
                    await DeviceOrientationEvent.requestPermission()
                    === "granted";
            }
        } catch (error) {
            motionPermission = false;
            orientationPermission = false;
        }

        if (motionPermission &&
            typeof DeviceMotionEvent !== "undefined") {
            window.addEventListener(
                "devicemotion",
                handleMotion
            );
        }

        if (orientationPermission &&
            typeof DeviceOrientationEvent !== "undefined") {
            window.addEventListener(
                "deviceorientation",
                handleOrientation
            );
        }

        if ("geolocation" in navigator) {
            gpsWatch = navigator.geolocation.watchPosition(
                handleGPS,
                () => {},
                {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 10000
                }
            );
        }

        running = true;

        startButton.textContent = "Запущено";

        requestAnimationFrame(update);
    }

    startButton.addEventListener("click", start);

})();
</script>

</body>
</html>
